function imp(q){const s=subj(selSub);let n=0;$('#ta').value.split('\n').forEach(l=>{const p=l.split('|').map(x=>x.trim()),t=p[0].toUpperCase();
if(t=='ISIAN'&&p[1]&&p[2]){s.q.push({t:'isian',q:p[1],k:p[2],pt:1});n++}
else if(t=='JODOH'&&p[1]&&p[2]){const pr=p[2].split(';').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x.length==2&&x[0]&&x[1]);if(pr.length>=2){s.q.push({t:'jodoh',q:p[1],p:pr,pt:pr.length});n++}}

else if(p.length>=7&&p[0]&&/^[A-E]$/i.test(p[6])){s.q.push({t:'pg',q:p[0],o:p.slice(1,6),k:p[6].toUpperCase(),pt:1});n++}

 return `<section class="c" style="background:linear-gradient(120deg,#102e50,#1d527d);color:#fff;border:0;overflow:hidden;position:relative">
 <div style="display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap">
  <div><div style="font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#c8d7e8;font-weight:700">Pusat Kendali Akademik</div>
  <div style="font-size:25px;font-weight:800;letter-spacing:-.6px;margin:5px 0">Dashboard Operator</div>
  <div style="font-size:13px;color:#d4e0ed">Ringkasan administrasi ujian sekolah · ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div>
  <div style="font-size:42px;opacity:.9">🎓</div>
 </div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:20px">
 ${[['👥','Total Siswa',students],['📚','Mata Ujian',subjects],['📝','Bank Soal',questions],['📊','Hasil Masuk',done],['📷','Absensi Wajah',attendance]].map(([i,l,v])=>`<div style="padding:14px;border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.09);border-radius:13px"><div style="font-size:18px">${i}</div><div style="font-size:25px;font-weight:800;margin-top:2px">${v}</div><div style="font-size:11px;color:#d3e0ee">${l}</div></div>`).join('')}
 </div></section>`;
}
const _garudaOpV=opV;
opV=function(){return garudaStats()+_garudaOpV()};
const _garudaSekV=sekV;
sekV=function(){return _garudaSekV()+`<div class="c"><h3>🛡️ Pusat Cadangan & Pemulihan Data</h3>
<p class="m">Simpan salinan data secara berkala. Cadangan mencakup identitas sekolah, akun operator, siswa, mata ujian, soal, hasil, absensi, dan catatan GPS.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="p" onclick="garudaExport()">Unduh Cadangan Data (.json)</button><label style="display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #dce3ed;border-radius:11px;cursor:pointer;background:#fff">Pulihkan Cadangan<input type="file" accept=".json,application/json" style="display:none" onchange="garudaImport(this)"></label></div>
<p class="m" style="margin-top:10px">Penting: data aplikasi versi ini masih disimpan pada browser/perangkat yang digunakan. Ekspor cadangan sebelum mengganti perangkat atau membersihkan data browser.</p></div>`};
function garudaExport(){
 const payload={app:'Aplikasi Ujian Sekolah',format:1,exportedAt:new Date().toISOString(),data:db};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadangan-ujian-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function garudaImport(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=()=>{
  try{const x=JSON.parse(rd.result),d=x.data||x;
   if(!d||!d.school||!d.op||!Array.isArray(d.students)||!Array.isArray(d.subjects))throw Error('Struktur cadangan tidak sesuai.');
   if(!confirm('Pulihkan cadangan akan mengganti data yang sedang ada pada browser ini. Lanjutkan?'))return;
   db=d;db.att=db.att||[];db.gps=db.gps||[];db.started=db.started||[];db.results=db.results||[];save();alert('Cadangan berhasil dipulihkan.');render();
  }catch(e){alert('File cadangan tidak valid: '+e.message)}
 };rd.readAsText(f);inp.value='';
}

render();
</script></body></html>
